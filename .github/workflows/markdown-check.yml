name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  required-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CLAUDE.md
          test -f .claude/agents/orquestrador.md
          test -f .claude/skills/autodev/SKILL.md
          test -f docs/QUALITY-GATES.md
      - name: Check for common secret file names
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep -q .; then
            echo "Potential secret file name detected; review repository contents."
            exit 1
          fi
